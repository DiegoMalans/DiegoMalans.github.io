<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego Tönz</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            text-align: center;
            max-width: 480px;
        }

        h1 {
            font-size: 0.75rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .meta {
            font-size: 0.65rem;
            color: #888888;
            margin-top: 6px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .quote {
            margin: 2.5rem 0 0 0;
            padding: 0;
            font-family: "Georgia", serif;
            font-size: 0.875rem;
            font-style: italic;
            line-height: 1.8;
            color: #444444;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>DIEGO TÖNZ</h1>
        <div class="meta">2008 until now</div>

        <p class="quote">
            "Choice may be real, or just a trick of the universe—either way, execution is everything. I don't wait for fate—I build it, test it, and force it into existence, so that on my deathbed, 'what if' is the only thing that dies empty-handed."
        </p>
    </div>

</body>
</html>
