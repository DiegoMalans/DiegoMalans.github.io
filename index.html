<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego Tönz</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .sub {
            font-size: 0.75rem;
            color: #888888;
            margin-top: 6px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .life-motto {
            margin: 2.5rem 0 0 0;
            padding: 0;
            font-family: "Georgia", serif;
            font-size: 1.15rem;
            font-style: italic;
            line-height: 1.6;
            color: #333333;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Diego Tönz</h1>
        <div class="sub">Switzerland</div>

        <blockquote class="life-motto">
            "May my life be a wild symphony of 'I lived, I tasted, I conquered,' never a silent graveyard of 'what if.' Let me burn through every horizon until my soul has no untasted wonder left to ask."
        </blockquote>
    </div>

</body>
</html>
